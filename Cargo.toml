[package]
name = "pentagon-cli"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91"
description = "The Pentagon infrastructure CLI"
repository = "https://github.com/arlington-labs/pentagon-cli"
publish = false

[[bin]]
name = "pentagon"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
fs2 = "0.4.3"
keyring = "4.2.0"
open = "5.4.2"
png = "0.18.0"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "multipart", "rustls", "system-proxy"] }
rpassword = "7.5.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
